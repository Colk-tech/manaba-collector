[project]
name = "manaba-collector"
version = "0.0.0"
description = """
manaba から課題・コース情報を収集・正規化し、\
自動追跡や外部サービスとの連携を可能にするツール。\
 / \
Collect and normalize assignment and course information \
from manaba for automated tracking and integration.\
"""
readme = "README.md"
authors = [
    { name = "Colk-tech", email = "github@colk.dev" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
manaba-collector = "manaba_collector:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # mypy can be removed once ty is GA.
    # it is added because ty is Beta now and not GA.
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "tach>=0.35.3",
    "ty>=0.0.84",
]
