---
name: Python CI [template]

"on":
  workflow_call:
    inputs:
      image:
        description: "Exact container image reference to test"
        type: string
        required: true

jobs:
  python-ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull "${{ inputs.image }}"

      - name: Run tach dependency checking in container
        run: |
          docker run --rm \
            "${{ inputs.image }}" \
            uv run tach check

      - name: Run mypy type checking in container
        run: |
          docker run --rm \
            "${{ inputs.image }}" \
            uv run mypy . --strict

      - name: Run ty type checking in container
        run: |
          docker run --rm \
            "${{ inputs.image }}" \
            uv run ty check .

      - name: Run ruff linter in container
        run: |
          docker run --rm \
            "${{ inputs.image }}" \
            uv run ruff check .

      - name: Run ruff formatter check in container
        run: |
          docker run --rm \
            "${{ inputs.image }}" \
            uv run ruff format --check .

      - name: Run tests
        run: |
          mkdir -p coverage
          touch coverage/coverage.xml
          chmod a+rw coverage/coverage.xml
          
          docker run --rm \
            --volume "${{ github.workspace }}/coverage/coverage.xml:/coverage/coverage.xml" \
            "${{ inputs.image }}" \
            uv run pytest \
              --cov \
              --cov-branch \
              --cov-report=xml:/coverage/coverage.xml
          
          test -s coverage/coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: true
          use_oidc: true
