---
name: Python CI [template]

"on":
  workflow_call:
    inputs:
      image:
        description: "Exact container image reference to test"
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Check / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tach
            command: uv run tach check
          - name: ruff-lint
            command: uv run ruff check .
          - name: ruff-format
            command: uv run ruff format --check .
          - name: ty
            command: uv run ty check .
          - name: mypy
            command: uv run mypy . --strict

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.name }}
        run: |
          docker run --rm \
            "${{ inputs.image }}" \
            ${{ matrix.command }}

  tests:
    name: Tests / pytest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        env:
          IMAGE: ${{ inputs.image }}
          COVERAGE_DIR: ${{ github.workspace }}/coverage
        run: |
          mkdir -p "$COVERAGE_DIR"
          chmod a+rwx "$COVERAGE_DIR"

          docker run --rm \
            --mount \
              "type=bind,source=$COVERAGE_DIR,target=/coverage" \
            "$IMAGE" \
            uv run pytest \
              --cov \
              --cov-branch \
              --cov-report=xml:/coverage/coverage.xml

          test -s "$COVERAGE_DIR/coverage.xml"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: true
          use_oidc: true
