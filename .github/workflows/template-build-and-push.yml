---
name: Docker Image Build and Push [template]

"on":
  workflow_call:
    inputs:
      registry:
        description: "The container registry to push to"
        required: false
        type: string
        default: "ghcr.io"

      build_target:
        description: "Target stage to build"
        type: string
        required: false
        default: "tester"

      image_name_base:
        description: "Base name of the Docker image"
        type: string
        required: true

      image_name_suffix:
        description: "Suffix appended to the image repository name"
        type: string
        required: false
        default: ""

    outputs:
      image:
        description: "Docker image repository"
        value: ${{ jobs.build-and-push.outputs.image }}

      tags:
        description: "Generated Docker image tags"
        value: ${{ jobs.build-and-push.outputs.tags }}

      digest:
        description: "Digest of the built Docker image"
        value: ${{ jobs.build-and-push.outputs.digest }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image repository
        id: image
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME_BASE: ${{ inputs.image_name_base }}
          IMAGE_NAME_SUFFIX: ${{ inputs.image_name_suffix }}
        run: |
          IMAGE_NAME="${IMAGE_NAME_BASE}${IMAGE_NAME_SUFFIX}"
          IMAGE_NAME="${IMAGE_NAME,,}"
          echo "name=${REGISTRY}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/python/Dockerfile
          push: true
          target: ${{ inputs.build_target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
