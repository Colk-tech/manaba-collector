---
name: Dev Container CI [template]

"on":
  workflow_call:

jobs:
  devcontainer-ci:
    name: Dev Container / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.89.0

      - name: Build and start Dev Container
        run: |
          devcontainer up \
            --workspace-folder . \
            --log-level info

      - name: Verify Dev Container
        run: |
          devcontainer exec --workspace-folder . \
            sh -eu -c '
              echo "=== Architecture ==="
              uname -m

              echo "=== User ==="
              id
              test "$(id -u)" -ne 0

              echo "=== Workspace ==="
              test "$(pwd)" = "/opt/app"
              test -f pyproject.toml
              test -f uv.lock

              echo "=== Python ==="
              uv run --frozen python --version
              uv run --frozen python -c \
                "import sys; assert sys.prefix == \"/opt/venv\""

              echo "=== Dependencies ==="
              uv sync --check

              echo "=== Package ==="
              uv run --frozen python -c \
                "import manaba_collector"

              echo "=== Smoke test passed ==="
            '
