---
name: Publish Multi-platform Image [template]

"on":
  workflow_call:
    inputs:
      image:
        required: true
        type: string

jobs:
  publish:
    name: Publish OCI Image Index
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE}:sha-${GITHUB_SHA}-arm64"

      - name: Verify published platforms
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker buildx imagetools inspect \
            "${IMAGE}:sha-${GITHUB_SHA}"
